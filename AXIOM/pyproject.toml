[project]
name = "darla-giggles"
version = "0.1.0"
description = "Local-first Darla application backend"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4,<5",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "openapi-spec-validator>=0.7,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -p backend.tests.healthy_runtime_plugin_005"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
